[package]
name = "lagoon"
version = "0.3.0"
description = "Dynamic Island для Windows"
authors = ["dorawebstart"]
license = "MIT"
repository = "https://github.com/dorawebstart/lagoon"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lagoon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
base64 = "0.22"
windows-future = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# HTTP-клієнт для LRCLIB; native-tls = TLS самої Windows (SChannel), без зайвих бібліотек
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# Глобальні гарячі клавіші (Ctrl+Alt+L — сховати / показати острів)
tauri-plugin-global-shortcut = "2"
