<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lagoon</title>
    <link rel="stylesheet" href="/src/island.css" />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <div class="island" id="island">
      <!-- Згорнутий стан: лише годинник -->
      <div class="island__compact">
        <time class="island__clock" data-clock>--:--</time>
      </div>

      <!-- Розгорнутий стан: поки великий годинник і дата; далі тут буде плеєр -->
      <div class="island__expanded">
        <time class="island__big-clock" data-clock>--:--</time>
        <span class="island__date" id="date"></span>
      </div>
    </div>
  </body>
</html>
