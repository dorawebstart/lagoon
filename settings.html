<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lagoon</title>
    <link rel="stylesheet" href="/src/settings.css" />
    <script type="module" src="/src/settings.js"></script>
  </head>

  <body>
    <!-- Ліворуч — бічне меню з розділами, праворуч — вміст вибраного розділу.
         Кожна секція має data-section; settings.js показує лише секції вибраного розділу -->
    <div class="layout">
      <nav class="sidebar" aria-label="Lagoon">
        <div class="sidebar__brand">Lagoon</div>
        <button class="nav-item" data-nav="look">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.5 0-1.2-1-1.3-1-2.5 0-.8.7-1.5 1.5-1.5H16a5 5 0 0 0 5-5c0-4-4-7.5-9-7.5z" /><circle cx="7.5" cy="11" r="1" /><circle cx="10" cy="7" r="1" /><circle cx="15" cy="7.5" r="1" /></svg>
          <span data-i18n="nav.look"></span>
        </button>
        <button class="nav-item" data-nav="size">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6" /></svg>
          <span data-i18n="nav.size"></span>
        </button>
        <button class="nav-item" data-nav="weather">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 11a3.5 3.5 0 0 0 0 7z" /></svg>
          <span data-i18n="nav.weather"></span>
        </button>
        <button class="nav-item" data-nav="island">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5" /><rect x="8" y="6.5" width="8" height="3" rx="1.5" /></svg>
          <span data-i18n="nav.island"></span>
        </button>
        <button class="nav-item" data-nav="claude">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6" /></svg>
          <span data-i18n="nav.claude"></span>
        </button>
        <button class="nav-item" data-nav="general">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg>
          <span data-i18n="nav.general"></span>
        </button>
      </nav>

    <main class="settings">
      <h1 id="section-title"></h1>

      <section class="field" data-section="general">
        <h2 data-i18n="settings.language"></h2>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="language" value="uk" /> <span>Українська</span></label>
          <label><input type="radio" name="language" value="en" /> <span>English</span></label>
        </div>
        <p class="hint" data-i18n="settings.languageHint"></p>
      </section>

      <section class="field" data-section="look">
        <h2 data-i18n="settings.theme"></h2>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="theme" value="classic" /> <span data-i18n="themes.classic"></span></label>
          <label><input type="radio" name="theme" value="graphite" /> <span data-i18n="themes.graphite"></span></label>
          <label><input type="radio" name="theme" value="glass" /> <span data-i18n="themes.glass"></span></label>
          <label><input type="radio" name="theme" value="custom" /> <span data-i18n="themes.custom"></span></label>
        </div>
        <!-- Кольори для теми «Свій колір» (видно лише коли вона вибрана) -->
        <div class="swatches" id="swatches" hidden>
          <label class="swatch" style="--swatch: #14213d">
            <input type="radio" name="color" value="#14213d" />
            <span data-i18n="colors.navy"></span>
          </label>
          <label class="swatch" style="--swatch: #3d1f3d">
            <input type="radio" name="color" value="#3d1f3d" />
            <span data-i18n="colors.plum"></span>
          </label>
          <label class="swatch swatch--custom">
            <input type="color" id="custom-color" value="#000000" />
            <span data-i18n="settings.colorCustom"></span>
          </label>
        </div>
      </section>

      <section class="field" data-section="look">
        <h2 data-i18n="settings.palettes"></h2>
        <!-- Кнопки палітр створює settings.js з src/palettes.js -->
        <div class="palettes" id="palettes"></div>
      </section>

      <section class="field" data-section="look">
        <h2 data-i18n="settings.accent"></h2>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="accent" value="cover" /> <span data-i18n="accent.cover"></span></label>
          <label><input type="radio" name="accent" value="custom" /> <span data-i18n="accent.custom"></span></label>
          <label><input type="radio" name="accent" value="theme" /> <span data-i18n="accent.theme"></span></label>
        </div>
        <label class="row color-row" id="accent-row" hidden>
          <span data-i18n="settings.accentPick"></span>
          <input type="color" class="color-input" id="accent-color" />
        </label>
        <p class="hint" data-i18n="settings.accentHint"></p>

        <label class="row switch-row">
          <span data-i18n="settings.wave"></span>
          <input type="checkbox" class="switch" id="show-wave" />
        </label>

        <div class="row color-row">
          <span data-i18n="settings.textColor"></span>
          <span class="color-pair">
            <button class="link" id="text-reset" data-i18n="settings.textReset"></button>
            <input type="color" class="color-input" id="text-color" />
          </span>
        </div>
      </section>

      <section class="field" data-section="size">
        <label class="range-row">
          <span data-i18n="settings.sizeScale"></span>
          <input type="range" id="island-scale" min="90" max="130" step="5" />
          <output for="island-scale" id="island-scale-out"></output>
        </label>
        <label class="range-row">
          <span data-i18n="settings.sizeLyricsWidth"></span>
          <input type="range" id="lyrics-width" min="220" max="420" step="10" />
          <output for="lyrics-width" id="lyrics-width-out"></output>
        </label>
        <label class="range-row">
          <span data-i18n="settings.sizeLyricsFont"></span>
          <input type="range" id="lyrics-font" min="11" max="16" step="1" />
          <output for="lyrics-font" id="lyrics-font-out"></output>
        </label>
        <!-- Шрифт пісні: кожну кнопку показуємо її ж шрифтом -->
        <div class="font-row">
          <span data-i18n="settings.songFont"></span>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="song-font" value="system" /> <span data-i18n="fonts.system"></span></label>
            <label><input type="radio" name="song-font" value="bahnschrift" /> <span style="font-family: Bahnschrift, sans-serif">Bahnschrift</span></label>
            <label><input type="radio" name="song-font" value="georgia" /> <span style="font-family: Georgia, serif">Georgia</span></label>
          </div>
        </div>
        <button class="link" id="reset-sizes" data-i18n="settings.sizeReset"></button>
      </section>

      <section class="field" data-section="weather">
        <label class="row switch-row">
          <span data-i18n="settings.weatherShow"></span>
          <input type="checkbox" class="switch" id="weather-enabled" />
        </label>
        <div class="row">
          <span data-i18n="settings.weatherCity"></span>
          <strong class="city-current" id="weather-city"></strong>
        </div>
        <!-- Пошук міста: результати — кнопки під полем (settings.js) -->
        <div class="city-search">
          <input type="search" id="city-query" class="text-input" autocomplete="off" data-i18n-placeholder="settings.weatherSearch" />
          <div class="city-results" id="city-results" role="listbox"></div>
        </div>
        <button class="link" id="weather-here" data-i18n="settings.weatherHere"></button>
        <p class="hint" id="weather-message" aria-live="polite"></p>
        <p class="hint" data-i18n="settings.weatherHint"></p>
      </section>

      <section class="field" data-section="island">
        <h2 data-i18n="settings.position"></h2>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="edge" value="top" /> <span data-i18n="settings.positionTop"></span></label>
          <label><input type="radio" name="edge" value="bottom" /> <span data-i18n="settings.positionBottom"></span></label>
        </div>
        <button class="link" id="reset-position" data-i18n="settings.positionReset"></button>
        <label class="row switch-row">
          <span data-i18n="settings.showLayout"></span>
          <input type="checkbox" class="switch" id="show-layout" />
        </label>
        <p class="hint" data-i18n="settings.positionHint"></p>
        <p class="hint" data-i18n="settings.visibilityHint"></p>
      </section>

      <section class="field" data-section="claude">
        <div class="row">
          <span data-i18n="settings.port"></span>
          <code id="agent-port">—</code>
        </div>
        <div class="row">
          <span data-i18n="settings.token"></span>
          <span class="token">
            <code id="agent-token">••••••••</code>
            <button class="link" id="toggle-token" data-i18n="settings.show"></button>
          </span>
        </div>
        <button class="primary" id="copy-hooks" data-i18n="settings.copyHooks"></button>
        <p class="hint" data-i18n="settings.hooksHint"></p>
      </section>

      <section class="field" data-section="general">
        <label class="row switch-row">
          <span data-i18n="settings.autostart"></span>
          <input type="checkbox" class="switch" id="autostart" />
        </label>
        <p class="hint" id="app-version"></p>
      </section>

      <p class="status" id="status" aria-live="polite"></p>
    </main>
    </div>
  </body>
</html>
