name: CI

on:
  pull_request:
  push:
    branches: [main]

# Нова збірка для тієї ж гілки скасовує стару
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Кеш Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Встановити npm-залежності
        run: npm ci

      - name: Зібрати фронтенд
        run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
